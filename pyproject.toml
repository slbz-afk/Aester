[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "starstack-prototype"
version = "1.0.0rc1"
description = "Local Siril-backed nightscape processing prototype"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "astropy>=7,<9", "Pillow>=11,<13", "tifffile>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
mcp = ["mcp>=1.28,<2"]
raw-metadata = ["rawpy==0.27.1"]
star-separation = ["imagecodecs==2026.8.16"]
starless = ["onnxruntime>=1.17"]   # 可选：产品内 ONNX 去星推理（docs/STARLESS_PACKAGE_20260923.md）；不进锁文件与试用包

[project.scripts]
starstack = "starstack.cli:main"
starstack-mcp = "starstack.mcp_server:main"
aester-retouch = "starstack.finishing_cli:main"
aester-retouch-mcp = "starstack.finishing_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["starstack", "starstack.*"]   # the desktop app (src/aester_desktop, GPL-3.0-or-later) ships in the installer, not in this engine distribution

[tool.setuptools.package-data]
starstack = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
